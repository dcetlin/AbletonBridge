[project]
name = "ableton-bridge"
version = "4.0.0"
description = "AbletonBridge — Ableton Live integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "William De Simone", email = "hidingwillmusic@outlook.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0,<2",
]

[project.optional-dependencies]
midi_cc = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
elevenlabs = [
    "elevenlabs>=0.2.26",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "rapidfuzz",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
]

[project.scripts]
ableton-bridge = "MCP_Server.server:main"
als-clone = "als_tools.clone:main"
als-trace = "als_tools.trace:main"
als-validate = "als_tools.validate:main"
elevenlabs-mcp = "elevenlabs_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["MCP_Server*", "elevenlabs_mcp", "shared", "als_tools"]

[tool.setuptools.package-data]
MCP_Server = ["browser_cache_seed.json", "midi_cc/*.json"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["MCP_Server", "shared", "als_tools"]
exclude = ["AbletonBridge_Remote_Script"]
strict = ["als_tools"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["als_tools", "tests/test_als_tools.py", "tests/test_als_trace.py"]

[project.urls]
"Homepage" = "https://github.com/WilliamDeSimone/AbletonBridge"
"Bug Tracker" = "https://github.com/WilliamDeSimone/AbletonBridge/issues"
