# LOM Path Catalog
#
# Reference of common Live Object Model properties reachable via the generic
# lom_get / lom_set / lom_describe commands. Grouped by object class. Paths are
# relative to their object: e.g. a "tracks" entry `name` is reached at
# "tracks[0].name", a "parameters" entry `value` at
# "tracks[0].devices[0].parameters[3].value".
#
# access: r (read-only) | rw (read/write)
# type:   str | int | float | bool

song:
  tempo:
    access: rw
    type: float
    min: 20.0
    max: 999.0
    doc: Project tempo in BPM.
  is_playing:
    access: rw
    type: bool
    doc: Whether the transport is running.
  current_song_time:
    access: rw
    type: float
    doc: Playhead position in beats.
  metronome:
    access: rw
    type: bool
    doc: Metronome on/off.
  loop:
    access: rw
    type: bool
    doc: Arrangement loop on/off.
  loop_start:
    access: rw
    type: float
    doc: Arrangement loop start in beats.
  loop_length:
    access: rw
    type: float
    doc: Arrangement loop length in beats.
  signature_numerator:
    access: rw
    type: int
    min: 1
    max: 99
    doc: Time signature numerator.
  signature_denominator:
    access: rw
    type: int
    doc: Time signature denominator (power of two).
  root_note:
    access: rw
    type: int
    min: 0
    max: 11
    doc: Global root note (0=C .. 11=B).
  scale_name:
    access: rw
    type: str
    doc: Global scale name (Live 11+).
  clip_trigger_quantization:
    access: rw
    type: int
    doc: Global launch quantization (enum index).
  swing_amount:
    access: rw
    type: float
    min: 0.0
    max: 1.0
    doc: Global groove swing amount.
  back_to_arranger:
    access: rw
    type: bool
    doc: True when session overrides the arrangement.
  record_mode:
    access: rw
    type: int
    doc: Arrangement record armed state.
  session_record:
    access: rw
    type: bool
    doc: Session record on/off.
  can_undo:
    access: r
    type: bool
    doc: Whether an undo step is available.
  can_redo:
    access: r
    type: bool
    doc: Whether a redo step is available.

tracks:
  name:
    access: rw
    type: str
    doc: Track name.
  color_index:
    access: rw
    type: int
    doc: Track color as a palette index.
  mute:
    access: rw
    type: bool
    doc: Track mute state.
  solo:
    access: rw
    type: bool
    doc: Track solo state.
  arm:
    access: rw
    type: bool
    doc: Track record-arm state (audio/MIDI tracks only).
  is_foldable:
    access: r
    type: bool
    doc: True for group tracks.
  fold_state:
    access: rw
    type: bool
    doc: Group track folded/unfolded.
  has_audio_input:
    access: r
    type: bool
    doc: True for audio tracks.
  has_midi_input:
    access: r
    type: bool
    doc: True for MIDI tracks.
  playing_slot_index:
    access: r
    type: int
    doc: Index of the currently playing clip slot (-1 if none).
  # Mixer sub-object: tracks[i].mixer_device.<param>.value
  mixer_device.volume.value:
    access: rw
    type: float
    min: 0.0
    max: 1.0
    doc: Track volume (normalized; ~0.85 = 0 dB).
  mixer_device.panning.value:
    access: rw
    type: float
    min: -1.0
    max: 1.0
    doc: Track pan (-1 left .. 1 right).
  mixer_device.sends[0].value:
    access: rw
    type: float
    min: 0.0
    max: 1.0
    doc: Send A level (index sends by [0], [1], ...).
  mixer_device.track_activator.value:
    access: rw
    type: float
    doc: Track on/off activator (0 or 1).

devices:
  name:
    access: rw
    type: str
    doc: Device display name.
  class_name:
    access: r
    type: str
    doc: Device class (e.g. "Wavetable", "Compressor2").
  class_display_name:
    access: r
    type: str
    doc: Human-readable device type name.
  is_active:
    access: r
    type: bool
    doc: Whether the device is enabled (not bypassed).
  type:
    access: r
    type: int
    doc: Device type enum (instrument/audio_effect/midi_effect).
  can_have_chains:
    access: r
    type: bool
    doc: True for rack devices.

parameters:
  name:
    access: r
    type: str
    doc: Parameter name.
  value:
    access: rw
    type: float
    doc: Current parameter value (native range min..max).
  min:
    access: r
    type: float
    doc: Minimum allowed value.
  max:
    access: r
    type: float
    doc: Maximum allowed value.
  default_value:
    access: r
    type: float
    doc: Parameter's default value.
  is_enabled:
    access: r
    type: bool
    doc: Whether the parameter can be automated/changed.
  is_quantized:
    access: r
    type: bool
    doc: True for stepped/enumerated parameters.
  state:
    access: r
    type: int
    doc: Parameter enable state (0=enabled, 1/2=disabled).

clips:
  name:
    access: rw
    type: str
    doc: Clip name.
  color_index:
    access: rw
    type: int
    doc: Clip color as a palette index.
  length:
    access: r
    type: float
    doc: Clip length in beats.
  looping:
    access: rw
    type: bool
    doc: Clip loop on/off.
  loop_start:
    access: rw
    type: float
    doc: Loop start in beats.
  loop_end:
    access: rw
    type: float
    doc: Loop end in beats.
  muted:
    access: rw
    type: bool
    doc: Clip mute (deactivated) state.
  gain:
    access: rw
    type: float
    min: 0.0
    max: 1.0
    doc: Audio clip gain (normalized).
  pitch_coarse:
    access: rw
    type: int
    min: -48
    max: 48
    doc: Audio clip transpose in semitones.
  pitch_fine:
    access: rw
    type: int
    min: -50
    max: 50
    doc: Audio clip fine transpose in cents.
  warping:
    access: rw
    type: bool
    doc: Audio clip warp on/off.
  signature_numerator:
    access: rw
    type: int
    doc: Clip time signature numerator.
  is_midi_clip:
    access: r
    type: bool
    doc: True for MIDI clips.
  is_audio_clip:
    access: r
    type: bool
    doc: True for audio clips.

scenes:
  name:
    access: rw
    type: str
    doc: Scene name.
  color_index:
    access: rw
    type: int
    doc: Scene color as a palette index.
  tempo:
    access: rw
    type: float
    doc: Scene tempo (-1 if unset).
  is_empty:
    access: r
    type: bool
    doc: True when the scene has no clips.
  is_triggered:
    access: r
    type: bool
    doc: True while the scene is queued to launch.
