name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -x -q

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyright==1.1.400

      # baseline 5 — remaining errors are unresolvable missing imports
      # (starlette, uvicorn, mido) that aren't in [dev] extras.
      # A count jump here can mean a dep failed to install, not a type regression.
      - name: Run pyright (ratchet — must not exceed baseline)
        run: |
          COUNT=$(pyright --outputjson | python -c "import sys,json; print(json.load(sys.stdin)['summary']['errorCount'])")
          echo "pyright errors: $COUNT (baseline: 5)"
          test "$COUNT" -le 5
